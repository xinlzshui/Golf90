<script>
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.getElementById("articles-list");

    articles.forEach(art => {
      // 在循环内确定当前文章使用的语言键
      const langKey = (typeof currentLang !== "undefined" && art.title[currentLang]) ? currentLang : "en";
      
      const titleText = art.title[langKey] || art.title["en"];
      const summaryText = art.summary[langKey] || art.summary["en"];
      
      const card = document.createElement("div");
      card.className = "text-card";
      card.innerHTML = `
        <h2><a href="article.html?id=${art.id}">${titleText}</a></h2>
        <p>${summaryText}</p>
        <a href="article.html?id=${art.id}" class="link-more" data-i18n="readMore">Read Full Article →</a>
      `;
      container.appendChild(card);
    });
  });
</script>
